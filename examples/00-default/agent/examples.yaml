examples:
  - question: "What was revenue yesterday?"
    query: "SELECT SUM(total_amount) FROM sales WHERE order_date = DATE_SUB(CURRENT_DATE(), 1)"
  - question: "Top 5 customers by lifetime value"
    query: "SELECT customer_id, SUM(total_amount) AS ltv FROM sales GROUP BY customer_id ORDER BY ltv DESC LIMIT 5"
