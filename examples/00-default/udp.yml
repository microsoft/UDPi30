# yaml-language-server: $schema=../../udp.schema.json
#
# 00-default — the COMPLETE udp.yml reference.
#
# One deployment definition that exercises every top-level section, every field,
# every resource type (Fabric, Entra, Azure), every tenant (admin) setting, the
# Microsoft Purview / information-protection settings, security, connections,
# policies, notifications, state, and multi-environment targets.
#
# It is a COPY-PASTE CATALOGUE, not a starting template. Delete what you do not
# need. Read README.md first — it explains the placeholders, the safety model for
# tenant settings, and which items are inventory/contract-only.
#
#   udpi30 validate -f udp.yml --skip-connection-check
#   udpi30 graph    -f udp.yml
#   udpi30 plan     -t dev                  # dry-run, nothing is created
#   udpi30 admin plan -f udp.yml            # READ-ONLY diff of tenant settings
#
# !! `udpi30 admin apply` rewrites ORG-WIDE Fabric policy. Never run it with this
# !! file unmodified — the `admin:` baseline below is an opinionated example.
#
# Why one big file: the validator, harness, and editors read this file directly.
# `include:` and `extends:` (see the bottom of this file) split a real project
# across files; they are left commented here so every setting stays in one place.

deployment:
  name: default-complete
  version: "1.0.0"
  description: "Complete reference deployment: every resource type, tenant setting, security and Purview setting"
  # Other udp.yml files this deployment depends on (recorded in state/history).
  depends_on:
    - ../01-minimal/udp.yml

# -----------------------------------------------------------------------------
# workspace — default Fabric workspace (targets may override every field)
# -----------------------------------------------------------------------------
workspace:
  name: default-complete
  # workspace_id: "<guid>"        # Deploy into an EXISTING workspace (wins over name). See the `existing` target.
  capacity_id: "${var.capacity_id}"   # `capacity:` is deprecated — use capacity_id.
  description: "Complete reference workspace (${deployment.name} v${deployment.version})"
  # Group items into workspace folders by type (Notebooks, Pipelines, Lakehouses,
  # Reports, Models, Databases, Warehouses, Environments, Agents, Variables,
  # Data Engineering, Data Factory, Real-Time, Graph, Maps, Healthcare).
  folders_by_type: true
  git_integration:
    provider: github                       # azuredevops | github
    organization: "${var.git_organization}"
    # project: "<ado-project>"             # Azure DevOps only
    repository: "${var.git_repository}"
    branch: main
    directory: /examples/00-default/items

# -----------------------------------------------------------------------------
# variables — `${var.name}`. Short form (string) and long form (description/default).
# Placeholders are zero-GUIDs / REPLACE-WITH-* so the file validates out of the box
# and fails loudly (not silently) if deployed unchanged.
# -----------------------------------------------------------------------------
variables:
  # Short form
  environment: "dev"
  region: "eastus"

  # Long form
  capacity_id:
    description: "Fabric capacity GUID"
    default: "00000000-0000-0000-0000-000000000000"
  subscription_id:
    description: "Target Azure subscription id"
    default: "00000000-0000-0000-0000-000000000000"
  tenant_id:
    description: "Microsoft Entra tenant id"
    default: "00000000-0000-0000-0000-000000000000"
  existing_workspace_id:
    description: "GUID of an existing workspace (used by the 'existing' target)"
    default: "00000000-0000-0000-0000-000000000000"
  git_organization:
    description: "GitHub organization that owns the workspace repository"
    default: "REPLACE-WITH-YOUR-GITHUB-ORG"
  git_repository:
    description: "Repository connected to the workspace"
    default: "REPLACE-WITH-YOUR-REPOSITORY"
  adls_connection_id:
    description: "Fabric connection GUID for authenticated ADLS shortcuts (empty = unauthenticated)"
    default: ""
  entra_owner_object_id:
    description: "Object id of the user/service principal that owns the Entra groups and apps"
    default: "00000000-0000-0000-0000-000000000000"
  workspace_owner_upn:
    description: "UPN of the workspace owner"
    default: "owner@contoso.com"
  # Security-group object ids referenced by the tenant settings in `admin:`.
  fabric_admins_group_id:
    description: "Fabric platform administrators"
    default: "00000000-0000-0000-0000-000000000000"
  fabric_creators_group_id:
    description: "Users allowed to create Fabric items and workspaces"
    default: "00000000-0000-0000-0000-000000000000"
  fabric_governance_group_id:
    description: "Data governance stewards (certification, sensitivity labels, Purview)"
    default: "00000000-0000-0000-0000-000000000000"
  fabric_ai_users_group_id:
    description: "Users allowed to use Copilot and AI experiences"
    default: "00000000-0000-0000-0000-000000000000"
  fabric_external_sharing_group_id:
    description: "Users approved for guest access and external data sharing"
    default: "00000000-0000-0000-0000-000000000000"
  fabric_automation_group_id:
    description: "Service principals allowed to call Fabric/admin APIs (includes the Purview scanner)"
    default: "00000000-0000-0000-0000-000000000000"
  fabric_contractors_group_id:
    description: "Contractors (excluded from export settings and external sharing)"
    default: "00000000-0000-0000-0000-000000000000"
  outage_notification_group_id:
    description: "Mail-enabled security group notified about service outages"
    default: "00000000-0000-0000-0000-000000000000"

# -----------------------------------------------------------------------------
# azure — deployment-wide defaults for all azure_* resources
# -----------------------------------------------------------------------------
azure:
  subscription: "${var.subscription_id}"
  location: eastus

# -----------------------------------------------------------------------------
# resources
# Resource keys must be unique across ALL types. lakehouses, warehouses,
# eventhouses, kql_databases and sql_databases allow only letters, numbers and
# underscores; Entra and Azure names follow their own platform rules.
# -----------------------------------------------------------------------------
resources:

  # ===========================================================================
  # FABRIC — Data Engineering
  # ===========================================================================
  environments:
    spark_env:
      description: "Shared Spark runtime 1.3 with libraries"
      runtime: "1.3"
      libraries:
        - semantic-link-labs
        - great-expectations>=0.18.0
        - delta-spark>=3.0
      conda_dependencies:
        - numpy=1.26
      spark_properties:
        spark.sql.shuffle.partitions: "200"
        spark.databricks.delta.autoCompact.enabled: "true"
    spark_env_legacy:
      description: "Spark runtime 1.2 (the other supported runtime)"
      runtime: "1.2"
      libraries: [azure-storage-blob]

  lakehouses:
    raw_lakehouse:
      description: "Raw landing zone with every shortcut flavour"
      enable_schemas: true
      sql_endpoint_enabled: true
      schemas:
        - ./schemas/raw.json
      shortcuts:
        # ADLS Gen2 shortcut with a file transformation (CSV -> Delta, kept in sync)
        - name: external_sales
          target: "adls://stdatalakedev01.dfs.core.windows.net/sales/daily/*.csv"
          path: Files
          connection_id: "${var.adls_connection_id}"
          transformation:
            type: file
            source_format: csv
            destination_table: raw_sales
            sync: true
        # Nested JSON, flattened and decompressed
        - name: api_events
          target: "adls://stdatalakedev01.dfs.core.windows.net/events/*.json.gz"
          path: Files
          connection_id: "${var.adls_connection_id}"
          transformation:
            type: file
            source_format: json
            destination_table: raw_events
            sync: true
            flatten: true
            compression: gzip
        # Parquet and Excel sources
        - name: partner_products
          target: "s3://partner-bucket/shared/products/"
          path: Files
          transformation:
            type: file
            source_format: parquet
            destination_table: partner_products
        - name: finance_reports
          target: "adls://stdatalakedev01.dfs.core.windows.net/finance/monthly/*.xlsx"
          path: Files
          connection_id: "${var.adls_connection_id}"
          transformation:
            type: file
            source_format: excel
            destination_table: finance_monthly
        # Plain shortcuts (Tables location, no transformation)
        - name: azure_sales_tables
          target: "adls://stdatalakedev01.dfs.core.windows.net/sales/tables"
          path: Tables
        - name: partner_feed
          target: "s3://partner-data-bucket/daily-feed"
          path: Files
        # Cross-workspace OneLake shortcut: onelake://<workspace-id>/<item-id>/<path>
        - name: shared_dimensions
          target: "onelake://00000000-0000-0000-0000-000000000001/00000000-0000-0000-0000-000000000002/Tables/dim_customer"
          path: Tables
    curated_lakehouse:
      description: "Curated, business-ready datasets"
      tables:
        sales:
          schema_path: ./schemas/sales.json
          partition_by: [order_date]
          description: "Curated sales fact table"
        customers:
          description: "Customer dimension"
    ai_lakehouse:
      description: "Unstructured data processed by AI shortcut transformations"
      shortcuts:
        - name: support_tickets
          target: "adls://stdatalakedev01.dfs.core.windows.net/support/tickets/*.json"
          path: Files
          connection_id: "${var.adls_connection_id}"
          transformation:
            type: ai
            ai_skill: summarize
            ai_model: gpt-4o
            destination_table: ticket_summaries
        - name: global_feedback
          target: "adls://stdatalakedev01.dfs.core.windows.net/feedback/*.json"
          path: Files
          connection_id: "${var.adls_connection_id}"
          transformation:
            type: ai
            ai_skill: translate
            ai_prompt: "Translate to English, preserve sentiment"
            destination_table: feedback_english
        - name: customer_emails
          target: "adls://stdatalakedev01.dfs.core.windows.net/emails/inbox/*.json"
          path: Files
          connection_id: "${var.adls_connection_id}"
          transformation:
            type: ai
            ai_skill: classify
            ai_prompt: "Classify as: complaint, inquiry, feedback, urgent, spam"
            destination_table: classified_emails
    telemetry_lakehouse:
      description: "Device telemetry (schemas and SQL endpoint explicitly disabled)"
      enable_schemas: false
      sql_endpoint_enabled: false

  notebooks:
    ingest_notebook:
      path: ./notebooks/ingest.py
      description: "Ingest raw data into the lakehouse"
      environment: spark_env
      default_lakehouse: raw_lakehouse
      spark_properties:
        spark.sql.shuffle.partitions: "400"
      parameters:
        source_path: "Files/landing"
        batch_size: 1000
        full_refresh: false
      folder: ETL/Bronze
    transform_notebook:
      path: ./notebooks/transform.py
      description: "Transform raw data into curated tables"
      environment: spark_env
      default_lakehouse: curated_lakehouse
      folder: ETL/Gold
    maintenance_notebook:
      path: ./notebooks/maintenance.py
      description: "Delta table maintenance (OPTIMIZE / VACUUM)"
      environment: spark_env_legacy
      default_lakehouse: curated_lakehouse
    cross_workspace_notebook:
      path: ./notebooks/cross_workspace.py
      description: "Reads a lakehouse that lives in another workspace"
      external_lakehouse: "workspace://shared-platform/shared_lakehouse"

  spark_job_definitions:
    batch_job:
      description: "Scheduled Spark batch job"
      path: ./spark_jobs/batch_job.py
      environment: spark_env
      default_lakehouse: curated_lakehouse
      args: ["--mode", "full", "--epochs", "10"]
      conf:
        spark.executor.memory: "8g"
        spark.sql.adaptive.enabled: "true"

  graphql_apis:
    data_api:
      description: "GraphQL API over the curated lakehouse"
      path: ./graphql/schema.graphql
      data_source: curated_lakehouse

  user_data_functions:
    udf_helpers:
      description: "Reusable user data functions"
      path: ./functions/function.json
      runtime: python

  materialized_lake_views:
    daily_sales_summary:
      description: "Daily sales rollup refreshed on a schedule"
      path: ./sql/daily_sales_summary.sql
      default_lakehouse: curated_lakehouse
      refresh_cron: "0 2 * * *"
      folder: Views

  # ===========================================================================
  # FABRIC — Data Factory
  # ===========================================================================
  pipelines:
    orchestration_pipeline:
      description: "Cron-scheduled orchestration with chained activities"
      schedule:
        frequency: cron
        cron: "0 6 * * *"
        timezone: America/Chicago
        start_time: "2026-01-01T00:00:00Z"
        enabled: true
      activities:
        - name: ingest
          notebook: ingest_notebook
          parameters:
            mode: incremental
        - name: transform
          notebook: transform_notebook
          depends_on: [ingest]
        - name: hourly_sync_run
          pipeline: hourly_sync
          depends_on: [transform]
      folder: Orchestration
    nightly_pipeline:
      description: "Daily schedule"
      schedule:
        frequency: daily
        timezone: UTC
      activities:
        - name: maintenance
          notebook: maintenance_notebook
    hourly_sync:
      description: "Hourly schedule"
      schedule:
        frequency: hourly
      activities:
        - name: sync
          notebook: ingest_notebook
    weekly_rollup:
      description: "Weekly schedule (disabled until reviewed)"
      schedule:
        frequency: weekly
        timezone: America/New_York
        enabled: false
      activities:
        - name: rollup
          notebook: transform_notebook
    monthly_close:
      description: "Monthly schedule"
      schedule:
        frequency: monthly
      activities:
        - name: close
          notebook: transform_notebook
    one_time_backfill:
      description: "Runs once at the given start time"
      schedule:
        frequency: once
        start_time: "2026-12-31T23:00:00Z"
      activities:
        - name: backfill
          notebook: ingest_notebook
    manual_pipeline:
      description: "Pipeline uploaded from a JSON definition file (no schedule)"
      path: ./pipelines/manual_pipeline.json

  copy_jobs:
    copy_job:
      description: "Copy data between stores"
      path: ./copyjobs/copyjob.json

  airflow_jobs:
    airflow_dag:
      description: "Apache Airflow orchestration job"
      path: ./airflow/dag.py

  mounted_data_factories:
    mounted_adf:
      description: "Mounted Azure Data Factory (the one declared under azure_data_factories)"
      data_factory_id: "/subscriptions/${var.subscription_id}/resourceGroups/rg-data-platform/providers/Microsoft.DataFactory/factories/adf-analytics"

  dbt_jobs:
    dbt_transform:
      description: "dbt transformation job (capacity-gated)"
      path: ./dbt/dbt-project.json
      environment: spark_env

  dataflows:
    ingest_dataflow:
      description: "Dataflow Gen2"
      path: ./dataflows/dataflow.json

  # ===========================================================================
  # FABRIC — Data Warehousing & Mirroring
  # ===========================================================================
  warehouses:
    analytics_warehouse:
      description: "SQL analytics warehouse"
      sql_scripts:
        - ./sql/create_views.sql
      folder: Warehouse

  sql_databases:
    app_db:
      description: "Operational SQL database"
      sql_scripts:
        - ./sql/app_schema.sql

  mirrored_databases:
    mirrored_sales:
      description: "Mirrored SQL Server database"
      source_type: SQLServer
      connection: sql_source

  mirrored_warehouses:
    mirrored_dw:
      description: "Mirrored warehouse (list-only)"
      source_type: Snowflake

  snowflake_databases:
    snowflake_db:
      description: "Snowflake-backed database"
      connection: snowflake_conn

  cosmosdb_databases:
    cosmos_db:
      description: "Cosmos DB mirrored database"
      connection: cosmos_source

  mirrored_databricks_catalogs:
    databricks_catalog:
      description: "Mirrored Azure Databricks catalog"
      connection: databricks_conn

  datamarts:
    sales_datamart:
      description: "Sales datamart (list-only)"
      path: ./datamarts/sales.json

  # ===========================================================================
  # FABRIC — Power BI
  # ===========================================================================
  semantic_models:
    sales_model:
      path: ./semantic_model/
      description: "Sales semantic model (TMDL)"
      default_lakehouse: curated_lakehouse
      auto_refresh: true
      refresh_timeout: 900
      after_deploy: [refresh]
      depends_on_run: [orchestration_pipeline]
      folder: BI/Models

  reports:
    sales_report:
      path: ./reports/sales/
      description: "Sales report (PBIR)"
      semantic_model: sales_model
      folder: BI/Reports
    cross_workspace_report:
      path: ./reports/cross_workspace/
      description: "Report bound to a semantic model in another workspace"
      external_semantic_model: "workspace://shared-platform/enterprise_model"

  paginated_reports:
    invoice_report:
      description: "Paginated invoice report"
      path: ./reports/invoices/invoice.rdl
      data_source: sales_model

  dashboards:
    exec_dashboard:
      description: "Executive dashboard (list-only)"

  # ===========================================================================
  # FABRIC — Data Science
  # ===========================================================================
  ml_models:
    churn_model:
      description: "Customer churn model"
      path: ./ml/churn_model/
      framework: sklearn
  ml_experiments:
    churn_experiment:
      description: "Churn model training experiment"
      path: ./ml/churn_experiment/

  # ===========================================================================
  # FABRIC — Real-Time Intelligence
  # ===========================================================================
  eventhouses:
    telemetry_eventhouse:
      description: "Eventhouse for IoT telemetry"
      kql_scripts:
        - ./kql/create_tables.kql
        - ./kql/create_functions.kql
      retention_days: 365
      cache_days: 30

  kql_databases:
    telemetry_db:
      description: "KQL database for device telemetry"
      parent_eventhouse: telemetry_eventhouse
      kql_scripts:
        - ./kql/create_tables.kql

  eventstreams:
    telemetry_stream:
      description: "Ingests IoT device events in real time"
      path: ./eventstreams/eventstream.json
      sources:
        - type: event_hub
          name: ehns-analytics
        - type: iot_hub
          name: iot-analytics-hub
      destinations:
        - type: eventhouse
          name: telemetry_eventhouse

  kql_querysets:
    telemetry_queries:
      description: "Saved KQL queries"
      path: ./kql/queryset.json
      data_source: telemetry_db

  kql_dashboards:
    ops_dashboard:
      description: "Real-time operations dashboard"
      path: ./kql/dashboard.json
      data_source: telemetry_db

  reflex:
    anomaly_alerts:
      description: "Data Activator alerting rules"
      path: ./reflex/reflex.json

  digital_twin_builders:
    plant_twin:
      description: "Digital twin builder"
      path: ./twins/definition.json
  digital_twin_builder_flows:
    plant_twin_flow:
      description: "Digital twin builder flow"
      path: ./twins/flow.json
      twin_builder: plant_twin

  event_schema_sets:
    event_schemas:
      description: "Event schema set (capacity-gated)"
      path: ./events/definition.json

  graph_query_sets:
    graph_queries:
      description: "Saved graph queries"
      path: ./graphs/queries.json
      data_source: knowledge_graph

  anomaly_detectors:
    telemetry_anomaly_detector:
      description: "Anomaly detection over telemetry"
      path: ./anomaly/definition.json
      data_source: telemetry_db

  # ===========================================================================
  # FABRIC — AI & Knowledge
  # ===========================================================================
  data_agents:
    analytics_agent:
      description: "Natural-language analytics agent"
      sources:
        - curated_lakehouse
        - analytics_warehouse
        - sales_model
      instructions: ./agent/instructions.md
      few_shot_examples: ./agent/examples.yaml
      tables_in_scope:
        - sales
        - customers

  operations_agents:
    ops_agent:
      description: "Operations copilot agent"
      sources: [telemetry_db]
      instructions: ./agent/ops_instructions.md

  ontologies:
    domain_ontology:
      description: "Business domain ontology"
      path: ./ontology/definition.json
      data_sources: [curated_lakehouse]

  # ===========================================================================
  # FABRIC — Graph, Spatial, Healthcare, Shared configuration
  # ===========================================================================
  graphs:
    knowledge_graph:
      description: "Knowledge graph"
      path: ./graphs/definition.json
      data_source: curated_lakehouse
  graph_models:
    graph_model:
      description: "Graph model definition"
      path: ./graphs/model.json
      data_source: curated_lakehouse
  map_items:
    asset_map:
      description: "Geospatial asset map"
      path: ./maps/definition.json
  hls_cohorts:
    patient_cohort:
      description: "Healthcare cohort (capacity-gated)"
      path: ./cohorts/definition.json
  variable_libraries:
    shared_vars:
      description: "Workspace-shared variables"
      variables:
        region: westus2
        tier: standard

  # ===========================================================================
  # MICROSOFT ENTRA (Microsoft Graph, tenant scope)
  # The key is the displayName. Create is idempotent (same name = patch).
  # Needs Group.ReadWrite.All / Application.ReadWrite.All.
  # ===========================================================================
  entra_groups:
    sg-fabric-admins:
      description: "Fabric platform administrators"
      mail_nickname: sg-fabric-admins
      security_enabled: true
      mail_enabled: false
      assignable_to_role: true
      owners: ["${var.entra_owner_object_id}"]
      members: []
    sg-fabric-creators:
      description: "Fabric item and workspace creators"
      security_enabled: true
      owners: ["${var.entra_owner_object_id}"]
    sg-fabric-governance:
      description: "Data governance stewards (labels, certification, Purview)"
      security_enabled: true
      owners: ["${var.entra_owner_object_id}"]
    sg-fabric-ai-users:
      description: "Copilot and AI experience users"
      security_enabled: true
    sg-fabric-external-sharing:
      description: "Approved for guest access and external data sharing"
      security_enabled: true
    sg-fabric-automation:
      description: "Service principals allowed to call Fabric and admin APIs"
      security_enabled: true
    sg-fabric-contractors:
      description: "Contractors (restricted export and sharing)"
      security_enabled: true
    sg-data-engineers:
      description: "Data engineering team"
      security_enabled: true
      members: ["${var.entra_owner_object_id}"]
    sg-data-analysts:
      description: "Business analysts"
      security_enabled: true
    sg-data-scientists:
      description: "Data science team"
      security_enabled: true

  entra_apps:
    app-udp-deploy:
      description: "CI/CD identity that runs udpi30"
      sign_in_audience: AzureADMyOrg
      redirect_uris: ["https://localhost:5001/signin-oidc"]
      identifier_uris: ["api://${var.tenant_id}/udp-deploy"]
      create_service_principal: true
    app-purview-scanner:
      description: "Service principal Microsoft Purview uses to scan Fabric / Power BI"
      sign_in_audience: AzureADMyOrg
      create_service_principal: true
    app-partner-portal:
      description: "Multi-tenant app registration (no service principal created here)"
      sign_in_audience: AzureADMultipleOrgs   # also: AzureADandPersonalMicrosoftAccount | PersonalMicrosoftAccount
      redirect_uris:
        - "https://portal.contoso.com/auth/callback"
        - "https://portal.contoso.com/auth/silent"
      create_service_principal: false

  # ===========================================================================
  # AZURE (ARM) — resource groups and storage accounts have first-class models
  # ===========================================================================
  azure_resource_groups:
    rg-data-platform:
      location: eastus
      tags: { env: "${var.environment}", workload: data-platform, deployment: "${deployment.name}" }
    rg-governance:
      subscription: "${var.subscription_id}"     # per-resource subscription override
      location: eastus
      tags: { env: "${var.environment}", workload: governance, data-owner: data-platform-team }
    rg-observability:
      location: eastus
      tags: { env: "${var.environment}", workload: observability }
    rg-networking:
      location: eastus
      tags: { env: "${var.environment}", workload: networking }
    rg-ai:
      location: eastus2
      tags: { env: "${var.environment}", workload: ai }

  azure_storage_accounts:
    stdataplatformdev01:                  # 3-24 lowercase letters and numbers
      subscription: "${var.subscription_id}"
      resource_group: rg-data-platform
      location: eastus
      sku: Standard_GRS
      kind: StorageV2
      access_tier: Cool
      https_only: true
      tags: { env: "${var.environment}", tier: archive }

  # Generic escape hatch — any ARM resource via an author-supplied .bicep file.
  azure_deployments:
    purview-governance:                   # resource-group scope
      scope: group
      resource_group: rg-governance
      location: eastus
      template_file: ./bicep/purview-governance.bicep
      parameters:
        purviewAccountName: purview-analytics
        logAnalyticsWorkspaceId: "/subscriptions/${var.subscription_id}/resourceGroups/rg-observability/providers/Microsoft.OperationalInsights/workspaces/law-analytics"
    subscription-policy-baseline:         # subscription scope (policy + Defender for Cloud)
      scope: subscription
      subscription: "${var.subscription_id}"
      location: eastus
      template_file: ./bicep/policy-baseline.bicep
      parameters:
        requiredTagName: data-owner
        enableDefender: false

  # ===========================================================================
  # AZURE SERVICES — each deploys as ONE ARM resource via generated Bicep.
  # The generated template emits only location, sku.name, kind, properties and
  # tags. Types needing sku.capacity/tier, identity, secrets or parent/extension
  # scope are INVENTORY ENTRIES — deploy those with `azure_deployments`.
  # ===========================================================================

  # --- Integration / streaming / compute ---
  azure_data_factories:
    adf-analytics:
      resource_group: rg-data-platform
      properties: { publicNetworkAccess: Enabled }
  azure_databricks_workspaces:
    dbw-analytics:
      resource_group: rg-data-platform
      sku: premium
      properties:
