# -----------------------------------------------------------------------------
# targets — environments. Each may override workspace, variables, security,
# run identity, per-resource properties, post-deploy checks and the strategy.
# -----------------------------------------------------------------------------
targets:
  dev:
    default: true
    workspace:
      name: default-complete-dev
      capacity_id: "${var.capacity_id}"
      description: "Development workspace"
      folders_by_type: true
    variables:
      environment: dev
      region: eastus
    post_deploy:
      - run: ingest_notebook
        expect: success
        timeout: 300

  staging:
    workspace:
      name: default-complete-staging
      capacity_id: "${var.capacity_id}"
      description: "Staging workspace"
    variables:
      environment: staging
    run_as:
      service_principal: app-udp-deploy
    security:
      roles:
        - name: staging-testers
          entra_group: sg-data-analysts
          workspace_role: contributor
    resources:
      notebooks:
        ingest_notebook:
          spark_properties:
            spark.sql.shuffle.partitions: "300"
      pipelines:
        orchestration_pipeline:
          schedule:
            enabled: false
    post_deploy:
      - run: orchestration_pipeline
        expect: success
        timeout: 600
      - sql: "SELECT COUNT(*) FROM curated_lakehouse.sales WHERE order_date = CURRENT_DATE()"
        expect: "> 0"
        timeout: 60

  prod:
    workspace:
      name: default-complete-prod
      capacity_id: "${var.capacity_id}"
      description: "Production workspace"
    variables:
      environment: prod
      region: westus2
    run_as:
      service_principal: app-udp-deploy
    security:
      roles:
        - name: prod-admins
          entra_group: sg-fabric-admins
          workspace_role: admin
        - name: prod-readers
          entra_group: sg-data-analysts
          workspace_role: viewer
          onelake_roles:
            - tables: [sales]
              permissions: [read]
    deployment_strategy:
      type: canary                      # or all-at-once (the default)
      canary_resources:
        - ingest_notebook
        - raw_lakehouse
      validation:
        run: ingest_notebook
        expect: success
        timeout: 300
    resources:
      lakehouses:
        raw_lakehouse:
          description: "Production landing zone"
      notebooks:
        ingest_notebook:
          spark_properties:
            spark.sql.shuffle.partitions: "800"
      pipelines:
        orchestration_pipeline:
          schedule:
            cron: "0 4 * * *"
      warehouses:
        analytics_warehouse:
          description: "Production analytics warehouse"
      semantic_models:
        sales_model:
          refresh_timeout: 1800
      reports:
        sales_report:
          folder: BI/Production
      data_agents:
        analytics_agent:
          tables_in_scope: [sales]
      environments:
        spark_env:
          runtime: "1.3"
      eventhouses:
        telemetry_eventhouse:
          retention_days: 730
      eventstreams:
        telemetry_stream:
          description: "Production telemetry stream"
    post_deploy:
      - run: ingest_notebook
        expect: success
        timeout: 900

  existing:
    # Deploy into an already-created workspace (workspace_id wins over name).
    workspace:
      name: default-complete-existing
      workspace_id: "${var.existing_workspace_id}"
    run_as:
      user_name: "${var.workspace_owner_upn}"

