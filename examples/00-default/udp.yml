# -----------------------------------------------------------------------------
# security — workspace roles (+ OneLake data access roles). One principal per role.
# -----------------------------------------------------------------------------
security:
  roles:
    - name: platform-admins
      entra_group: sg-fabric-admins
      workspace_role: admin
    - name: data-engineers
      entra_group: sg-data-engineers
      workspace_role: contributor
      onelake_roles:
        - tables: [sales, customers]
          folders: ["/Files/raw"]
          permissions: [readwrite]
    - name: analytics-engineers
      entra_group: sg-fabric-creators
      workspace_role: member
    - name: analysts
      entra_group: sg-data-analysts
      workspace_role: viewer
      onelake_roles:
        - tables: ["*"]
          permissions: [read]
    - name: data-scientists
      entra_group: sg-data-scientists
      workspace_role: contributor
      onelake_roles:
        - tables: [sales]
          permissions: [read, write]
        - folders: ["/Files/models"]
          permissions: [write]
    - name: ci-cd-deployer
      service_principal: app-udp-deploy
      workspace_role: admin
    - name: purview-scanner
      service_principal: app-purview-scanner
      workspace_role: viewer
    - name: workspace-owner
      entra_user: "${var.workspace_owner_upn}"
      workspace_role: admin

# -----------------------------------------------------------------------------
# connections — data-source connections (secrets via ${secret.*} / ${keyvault.*.*}
# or connection_string_var; never inline). Types: adls_gen2 | sql_server |
# azure_sql | cosmos_db | kusto | http | custom
# -----------------------------------------------------------------------------
connections:
  adls_source:
    type: adls_gen2
    endpoint: "https://stdatalakedev01.dfs.core.windows.net"
    auth_method: managed_identity
  sql_source:
    type: sql_server
    endpoint: "sql-onprem.contoso.com"
    database: salesdb
    auth_method: service_principal
    connection_string_var: UDP_SQL_SOURCE_CONNECTION_STRING
  azure_sql_source:
    type: azure_sql
    endpoint: "sql-analytics-server.database.windows.net"
    database: sqldb-analytics
    auth_method: service_principal
  cosmos_source:
    type: cosmos_db
    endpoint: "https://cosmos-analytics.documents.azure.com:443/"
    database: telemetry
    auth_method: key
    connection_string_var: UDP_COSMOS_CONNECTION_STRING
  kusto_source:
    type: kusto
    endpoint: "https://telemetry.eastus.kusto.windows.net"
    database: telemetry
    auth_method: managed_identity
  api_source:
    type: http
    endpoint: "https://api.contoso.com/v2"
    properties:
      api_version: "2024-01-01"
      timeout: "30"
      api_key: "${secret.CONTOSO_API_KEY}"
  snowflake_conn:
    type: custom
    endpoint: "contoso-analytics.snowflakecomputing.com"
    properties:
      warehouse: ANALYTICS_WH
      role: UDP_READER
      password: "${keyvault.kv-governance.snowflake-password}"
  databricks_conn:
    type: custom
    endpoint: "adb-1234567890123456.7.azuredatabricks.net"
    auth_method: service_principal
    properties:
      catalog: main

# -----------------------------------------------------------------------------
# policies — enforced by `validate` and `deploy`
# -----------------------------------------------------------------------------
policies:
  # NOTE: require_description and naming_convention apply to EVERY resource key,
  # including Azure and Entra names (hyphens, dots, no description field). They
  # are therefore left off here; enable them in Fabric-only deployments:
  #   require_description: true
  #   naming_convention: snake_case
  max_notebook_size_kb: 500
  blocked_libraries:
    - tensorflow
    - boto3
  # Accepted by the schema; not yet evaluated by the engine.
  rules:
    - name: max-resources
      check: max_resources
      value: 200
      severity: warning
    - name: require-environment
      check: require_environment
      severity: error

# -----------------------------------------------------------------------------
# notifications — webhooks after deploy (types: slack | teams)
# Placeholders: {deployment.name} {deployment.version} {target}
# -----------------------------------------------------------------------------
notifications:
  on_success:
    - type: slack
      webhook: "${secret.UDP_SLACK_WEBHOOK}"
      message: "Deployed {deployment.name} v{deployment.version} to {target}"
    - type: teams
      webhook: "${secret.UDP_TEAMS_WEBHOOK}"
  on_failure:
    - type: slack
      webhook: "${secret.UDP_SLACK_ALERTS_WEBHOOK}"
      message: "FAILED: {deployment.name} v{deployment.version} deployment to {target}"
    - type: teams
      webhook: "${secret.UDP_TEAMS_ALERTS_WEBHOOK}"

# -----------------------------------------------------------------------------
# state — where deployment state lives. local | azureblob | onelake | adls
# (the remote backends are beta; use one for team/CI deployments)
# -----------------------------------------------------------------------------
state:
  backend: local
  # backend: azureblob
  # config:
  #   account_name: "stdataplatformdev01"
  #   container_name: "udpi30-state"      # default: udpi30-state
  #   prefix: "default-complete"            # optional key prefix
  #   # account_key: omit so DefaultAzureCredential is used
  # backend: onelake
  # config:
  #   workspace_id: "<workspace-guid>"
  #   lakehouse_id: "<lakehouse-guid>"
  #   path: ".udpi30-state"               # default: .udpi30-state
  # backend: adls
  # config:
  #   account_name: "stadlsanalytics01"
  #   filesystem: "udpi30-state"          # default: udpi30-state
  #   prefix: "default-complete"

# -----------------------------------------------------------------------------
# admin — TENANT-WIDE Fabric settings (Fabric Admin API). NEVER applied by
# `deploy`; only by `udpi30 admin apply`. Keys are API `settingName`s (not
# portal titles). All settings the tenant exposes are listed, grouped like the
# Admin portal; each one carries its portal title as a comment.
#
# Posture of this baseline (an EXAMPLE — review every line before applying):
#   * external sharing, publish-to-web, template apps, SAS tokens: off / restricted
#   * item creation and previews: scoped to the creators group
#   * Copilot / AI: scoped to the AI group, cross-region data movement off
#   * Purview / information protection: labels on, inheritance on, AI interaction
#     security on, protected-label link sharing blocked
#   * Admin APIs and service principals: scoped to the automation group (this is
#     what lets a Purview scanner service principal read Fabric / Power BI metadata)
#   * Private Link allowed, but public access NOT blocked (enabling the block
#     before your private network is ready can lock everyone out)
#
# delegate_to_* are declared only where the API exposes the flag for a setting.
# Security groups are declared only for settings that accept them.
# -----------------------------------------------------------------------------
admin:
  tenant_settings:
    # === Additional workloads ===
    # Capacity admins and contributors can add and remove additional workloads
    FabricAddPartnerWorkload:
      enabled: true
      enabled_security_groups:
        - graph_id: "${var.fabric_admins_group_id}"
          name: "Fabric Administrators"
      properties:
        - name: "OnlyCapacityAdmins"
          value: "true"
          type: Boolean
    # Workspace admins can add and remove additional workloads (preview)
    FabricAddWorkloadToWorkspace:
      enabled: false
    # Workspace admins can develop partner workloads
    FabricThirdPartyWorkloads:
      enabled: false
    # Users can see and work with additional workloads not validated by Microsoft
    ThirdPartyPrivateWorkloads:
      enabled: false

    # === Admin API settings ===
    # Enhance admin APIs responses with detailed metadata
    AdminApisIncludeDetailedMetadata:
      enabled: true
      enabled_security_groups:
        - graph_id: "${var.fabric_automation_group_id}"
          name: "Fabric Automation"
    # Enhance admin APIs responses with DAX and mashup expressions
    AdminApisIncludeExpressions:
      enabled: true
      enabled_security_groups:
        - graph_id: "${var.fabric_automation_group_id}"
          name: "Fabric Automation"
    # Service principals can access read-only admin APIs
    AllowServicePrincipalsUseReadAdminAPIs:
      enabled: true
      enabled_security_groups:
        - graph_id: "${var.fabric_automation_group_id}"
          name: "Fabric Automation"
    # Service principals can access admin APIs used for updates
    AllowServicePrincipalsUseWriteAdminAPIs:
      enabled: false

    # === Advanced networking ===
    # Tenant-level Private Link
    AllowAccessOverPrivateLinks:
      enabled: true
    # Block Public Internet Access
    BlockAccessFromPublicNetworks:
      enabled: false
    # Configure workspace-level IP firewall rules and trusted resource instances
    ConfigureWorkspaceLevelIPFirewallRules:
      enabled: true
    # Configure workspace-level inbound network rules
    WorkspaceBlockInboundAccess:
      enabled: true
    # Configure workspace-level outbound network rules
    WorkspaceBlockOutboundAccess:
      enabled: true

    # === App settings ===
    # Push apps to end users
    AppPush:
      enabled: true
      enabled_security_groups:
        - graph_id: "${var.fabric_creators_group_id}"
          name: "Fabric Creators"
    # Publish apps to the entire organization
    PublishContentPack:
      enabled: false
    # Create template organizational apps
    TemplatePublish:
      enabled: false

    # === Audit and usage settings ===
    # Show user data in the Fabric Capacity Metrics app and reports
    AllowCapacityMetricsReportUserMask:
      enabled: false
    # Microsoft can store query text to aid in support investigations
    ASCollectQueryTextTelemetryTenantSwitch:
      enabled: false
    # Azure Log Analytics connections for workspace administrators
    LogAnalyticsAttachForWorkspaceAdmins:
      enabled: true
      enabled_security_groups:
        - graph_id: "${var.fabric_admins_group_id}"
          name: "Fabric Administrators"
    # Workspace admins can turn on monitoring for their workspaces (preview)
    PlatformMonitoringTenantSetting:
      enabled: true
      delegate_to_capacity: true
      enabled_security_groups:
        - graph_id: "${var.fabric_admins_group_id}"
          name: "Fabric Administrators"
    # Usage metrics for content creators
    UsageMetrics:
      enabled: true
    # Per-user data in usage metrics for content creators
    UsageMetricsTrackUserLevelInfo:
      enabled: false

    # === Azure AI Service ===
    # Allow data processing outside geographic region for Azure AI services
    AllowUserDataProcessedByAiServicesOutOfGeo:
      enabled: false
      delegate_to_capacity: false

    # === Azure Maps services ===
    # Users can use Azure Maps services
    AzureMapsInFabric:
      enabled: true
      enabled_security_groups:
        - graph_id: "${var.fabric_creators_group_id}"
          name: "Fabric Creators"
    # Data sent to Azure Maps can be processed outside your capacity's geographic region, compliance boundary or national cloud instance
    AzureMapsInFabricCrossRegionDataProcessing:
      enabled: false
    # Users can use Azure Maps Weather Services (Preview)
    AzureMapsWeatherServices:
      enabled: false

    # === Copilot and AI ===
    # Data sent to Azure OpenAI can be processed outside your capacity's geographic region, compliance boundary, or national cloud instance
    AllowSendAOAIDataToOtherRegions:
      enabled: false
      delegate_to_capacity: false
    # Data sent to OpenAI as a Microsoft Subprocessor can be processed outside your capacity's geographic region, compliance boundary, or national cloud instance
    AllowSendOpenAISubprocessorDataToOtherRegions:
      enabled: false
      delegate_to_capacity: false
